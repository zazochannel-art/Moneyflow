<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MONEYFLOW — offline</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09090B" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #09090b;
        color: #fafafa;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 1.25rem;
        padding: 2rem 1.5rem;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 1rem;
        display: block;
      }
      h1 { font-size: 1.05rem; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
      p { margin: 0 0 1.25rem; font-size: 0.875rem; color: #a1a1aa; line-height: 1.5; }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.625rem;
        background: #06b6d4;
        color: #052f36;
        font: inherit;
        font-weight: 600;
        font-size: 0.875rem;
        padding: 0.625rem 1.25rem;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.1); }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="mark" src="/icons/icon-192.png" alt="" width="56" height="56" />
      <h1>Ești offline</h1>
      <p>
        MONEYFLOW are nevoie de conexiune ca să-ți arate soldul real. Revino când
        ai internet — datele tale sunt în siguranță.
      </p>
      <button type="button" onclick="location.reload()">Încearcă din nou</button>
    </div>
  </body>
</html>
